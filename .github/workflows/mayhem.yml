          - mayhem/Mayhemfile_encoder_tile_fuzzer
          - mayhem/Mayhemfile_encoder_tim_fuzzer
          - mayhem/Mayhemfile_encoder_ttf_fuzzer
          - mayhem/Mayhemfile_encoder_uyvy_fuzzer
          - mayhem/Mayhemfile_encoder_vicar_fuzzer
          - mayhem/Mayhemfile_encoder_vid_fuzzer
          - mayhem/Mayhemfile_encoder_viff_fuzzer
          - mayhem/Mayhemfile_encoder_vips_fuzzer
          - mayhem/Mayhemfile_encoder_wbinfo_fuzzer
          - mayhem/Mayhemfile_encoder_wpg_fuzzer
          - mayhem/Mayhemfile_encoder_xcf_fuzzer
          - mayhem/Mayhemfile_encoder_ycbcr_fuzzer
          - mayhem/Mayhemfile_encoder_yuv_fuzzer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.ref }}
      - name: Start analysis for ${{ matrix.mayhemfile }}
        uses: ForAllSecure/mcode-action@v1
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ needs.build.outputs.image }} --file ${{ matrix.mayhemfile }} --duration ${{ inputs.duration || '1200' }}
